name: Docker CN

on:
  push:
    branches: [main-cn]
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/docker-cn.yml'
  workflow_dispatch:

# 串行发布；等待中的运行可能被替换
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror-postgres:
    name: 同步 PostgreSQL 镜像到国内仓库
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_VERSION: '17.11'
      REGISTRY: ${{ vars.CN_REGISTRY }}
      REGISTRY_NAMESPACE: ${{ vars.CN_REGISTRY_NAMESPACE }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.CN_REGISTRY }}
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}
      - name: 拉取官方镜像并推送到 ACR
        run: |
          source_image="postgres:${POSTGRES_VERSION}"
          target_image="${REGISTRY}/${REGISTRY_NAMESPACE}/pjyk-postgres:${POSTGRES_VERSION}"
          docker pull "$source_image"
          docker tag "$source_image" "$target_image"
          docker push "$target_image"

  build:
    name: 构建并推送 ${{ matrix.module }} 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.CN_REGISTRY }}
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ vars.CN_REGISTRY }}/${{ vars.CN_REGISTRY_NAMESPACE }}/pjyk-${{ matrix.module }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.module }}
          file: ${{ matrix.module }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 两个镜像各用一个 scope，否则会互相覆盖缓存索引
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
