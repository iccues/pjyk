name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    name: Server 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew build

  web:
    name: Web 检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 格式检查
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      # 失败说明后端 schema 或前端查询改了但没重新生成，在 web/apps/client 下运行 pnpm codegen
      - name: 检查 GraphQL 生成代码是否最新
        run: |
          pnpm --filter @pjyk-web/client codegen
          git diff --exit-code -- apps/client/src/graphql/generated
      - name: 类型检查与构建
        run: pnpm -r build
