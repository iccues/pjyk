spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

mal:
  client-id: test-client-id

oidc:
  enabled: false

platform:
  bangumi:
    popularity-weight: 2
    popularity-median: 800.0
    score-weight: 2
    score-prior-strength: 1000
    score-mean: 6.0
    score-std: 1.0
  anilist:
    popularity-weight: 1
    popularity-median: 16000.0
    score-weight: 1
    score-mean: 70.0
    score-std: 10.0
  myanimelist:
    popularity-weight: 1
    popularity-median: 25000.0
    score-weight: 1
    score-mean: 7.0
    score-std: 1.0
