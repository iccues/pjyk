services:
  # PostgreSQL 数据库
  pjyk-postgres:
    image: postgres:17.11
    container_name: pjyk-postgres
    environment:
      POSTGRES_DB: pjyk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pjyk-network
    restart: unless-stopped

  # 后端服务
  pjyk-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pjyk-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://pjyk-postgres:5432/pjyk
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MAL_CLIENT_ID: ${MAL_CLIENT_ID}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_ISSUER: ${OIDC_ISSUER}
    depends_on:
      pjyk-postgres:
        condition: service_healthy
    networks:
      - pjyk-network
    restart: unless-stopped

  pjyk-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: pjyk-web
    ports:
      - "80:80"
      - "81:81"
    depends_on:
      - pjyk-server
    networks:
      - pjyk-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  pjyk-network:
    driver: bridge
    name: pjyk-network
